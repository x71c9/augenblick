crate_name          = "augenblick"
binary_name         = "augenblick"
pkgdesc             = "Fullscreen eye-blink overlay for X11 and Wayland"
aur_depends         = "'glibc'"
systemd_user_unit   = "contrib/augenblick.service"
homebrew_caveats    = "augenblick draws the overlay through XQuartz, the X server for macOS, which is not part of macOS:\n  brew install --cask xquartz\nXQuartz sets DISPLAY only for the sessions started after a logout and login; until then:\n  open -a XQuartz\n  DISPLAY=:0 augenblick"
extra_apt_packages  = "libwayland-dev"
